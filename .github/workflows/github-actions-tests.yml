name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.10'

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/frontend-vite

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm install
      
    - name: Try to fix Vite issue
      run: npm update vite @vitejs/plugin-vue
      
    - name: Build project
      run: npm run build
      
    - name: Run linting
      run: npm run lint || echo "Linting not configured"

    - name: Run unit tests
      run: npm run test || echo "Tests not configured"
      
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: services/backend/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Check Python syntax
      run: |
        find . -name "*.py" -exec python -m py_compile {} \;
        
    - name: Run basic tests
      run: |
        python -m pytest tests/ -v

    - name: Quick health check
      run: |
        python -c "
        from app.main import app
        from app.core.config import settings
        print('App imports successfully')
        print('Settings loaded')
        "
        

  docker-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Docker Compose
      run: docker compose config

    - name: Test Docker Compose startup
      run: |
        docker compose up -d
        sleep 10
        docker compose ps
        docker compose down
