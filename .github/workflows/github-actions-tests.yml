name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/frontend-vite

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/frontend-vite/package.json

    - name: Install dependencies
      run: npm install

    - name: Run linting
      run: npm run lint || echo "Linting not configured"

    - name: Run unit tests
      run: npm run test || echo "Tests not configured"

    - name: Build project
      run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: services/backend/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pip install flake8 || echo "Flake8 not available"

    - name: Run linting
      run: |
        # Если используете flake8
        command -v flake8 >/dev/null 2>&1 && flake8 . --count --max-complexity=10 --max-line-length=127 --statistics || echo "Flake8 not installed"
    - name: Run unit tests
      run: |
        pytest --cov=./ --cov-report=xml || echo "Pytest not configured"

    - name: Upload coverage to Codecov
      if: success() || failure()
      uses: codecov/codecov-action@v3
      with:
        file: ./services/backend/coverage.xml

  docker-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Docker Compose
      run: docker compose config

    - name: Test Docker Compose startup
      run: |
        docker compose up -d
        sleep 10
        docker compose ps
        docker compose down
