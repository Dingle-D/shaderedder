version: '3.8'

services:

  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}


  redis:
    image: redis:8.0-rc1-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli" ,"ping"]
      interval: 10s 
      retries: 5 
      start_period: 10s 
      timeout: 5s
    volumes:
      - redis-data:/data
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: '${DOCKER_IMAGE_BACKEND?Variable not set}'
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy 
        restart: true
    ports:
      - 5000:5000 
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      #- SENTRY_DSN=${SENTRY_DSN}
      - STORAGE=${STORAGE}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY?Variable not set}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY?Variable not set}
      - S3_SECRET_KEY=${S3_SECRET_KEY?Variable not set}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL?Variable not set}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME?Variable not set}
      - S3_CERTIFICATE=${S3_CERTIFICATE?Variable not set}
    volumes:
      - ./services/backend:/app
      - ./uploads:${STORAGE}
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 5000


  frontend:
    build: 
      context: '${DOCKER_IMAGE_FRONTEND?Variable not set}'
      dockerfile: Dockerfile
      args: 
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
        VITE_API_URL: ${BACKEND_API_URL}
    ports:
      - 8080:8080
    volumes:
      - ./services/frontend-vite:/app 
      - /app/node_modules
    command: yarn dev --host


volumes:
  app-db-data:
  redis-data:
  pgadmin:
